# @path[.pre-commit-config.yaml]
# pre-commit hooks for the rules, docs, and scripts in this repo.

default_install_hook_types:
  - pre-commit

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-executables-have-shebangs
      - id: check-json
      - id: check-merge-conflict
      - id: check-shebang-scripts-are-executable
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/D7x7z49/fix-headers-hook
    rev: v0.3.0
    hooks:
      - id: fix-headers
        files: '^(?:\.pre-commit-config\.yaml|pyproject\.toml|ruff\.toml)$|^(?:\.agent|neovim|scripts|tmux)/'

  - repo: https://github.com/D7x7z49/lint-editor
    rev: v0.4.0
    hooks:
      - id: lint-editor

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: local
    hooks:
      - id: check-agent-files
        name: check .agent file formats
        entry: uv run --no-env-file --locked python scripts/ci/check-agent-files.py
        language: system
        pass_filenames: false
        always_run: true
