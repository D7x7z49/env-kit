# tmux/index.conf
# env-kit tmux settings: a status bar, extended keys for pi, and the mouse.
# everything else, including key bindings, is left alone.
#
#   usage:  tmux source-file tmux/index.conf
#   deploy: cp tmux/index.conf ~/.tmux.conf

# ==========================================================
# TERMINAL
# ==========================================================
# - extended keys let pi tell Shift+Enter apart from Enter.
# - the setting is negotiated at attach, so restart tmux after changing it.

set -g extended-keys on
set -g extended-keys-format csi-u

# ==========================================================
# MOUSE
# ==========================================================
# - mouse on lets tmux capture mouse events and bind them as keys.
# - wheel scrolls, a click selects a pane, a drag on a border resizes.
# - a pane that asks for the mouse (nvim, pi) still gets the events.

set -g mouse on

# ==========================================================
# PALETTE
# ==========================================================
# - every tunable colour lives here.
# - colour only reinforces, it never carries information.

set -g @bar_bg     "#1a1b26"   # bar background
set -g @bar_fg     "#c0caf5"   # bar foreground
set -g @dim_fg     "#565f89"   # dimmed text
set -g @hi_bg      "#3b4261"   # active window background
set -g @hi_fg      "#7aa2f7"   # active window foreground
set -g @session_bg "#41a6b5"   # session name background
set -g @session_fg "#1a1b26"   # session name foreground
set -g @win_bg     "#292e42"   # inactive window background
set -g @prefix_bg  "#e0af68"   # prefix mode background
set -g @prefix_fg  "#1a1b26"   # prefix mode foreground
set -g @copy_bg    "#bb9af7"   # copy mode background
set -g @copy_fg    "#1a1b26"   # copy mode foreground

# ==========================================================
# LAYOUT
# ==========================================================

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 60

# ==========================================================
# MODES
# ==========================================================
# badge text is padded to six columns, so the session name stays aligned.

set -g @mode_normal "NORMAL"
set -g @mode_prefix "PREFIX"
set -g @mode_copy   "COPY  "

# ==========================================================
# BAR STYLE
# ==========================================================
# prefix mode shifts the whole bar background, so peripheral vision catches it.
# inner commas are escaped as #, so a #{?} branch is not split in two.

set -g status-style "#{?client_prefix,bg=#{@prefix_bg}#,fg=#{@prefix_fg},bg=#{@bar_bg}#,fg=#{@bar_fg}}"

# ==========================================================
# SEGMENTS
# ==========================================================
# - left: mode badge, then the session name.
# - middle: window list, active window in brackets.
# - right: time.
#
# mode condition order: client_prefix, then pane_in_mode, then normal

set -g status-left "#{?client_prefix,#[bg=#{@prefix_bg}]#[fg=#{@prefix_fg}],#{?pane_in_mode,#[bg=#{@copy_bg}]#[fg=#{@copy_fg}],}}#{?client_prefix,#{@mode_prefix},#{?pane_in_mode,#{@mode_copy},#{@mode_normal}}} #[default]#[bg=#{@session_bg},fg=#{@session_fg}] #S #[default] "

setw -g window-status-format "#[bg=#{@win_bg},fg=#{@dim_fg}] #I#[fg=#{@bar_fg}]:#W #[default]"
setw -g window-status-current-format "#[bg=#{@hi_bg},fg=#{@hi_fg}] [#I#[fg=#{@dim_fg}]:#[fg=#{@bar_fg}]#W#[fg=#{@hi_fg}]] #[default]"

set -g status-right " #[fg=#{@dim_fg}]%H:%M "
