# @path[tmux/parts/palette.conf]
# every tunable colour; the status bar reads them through @ options.

# ==========================================================
# PALETTE
# ==========================================================
# - every tunable colour lives here.
# - colour only reinforces, it never carries information.

set -g @bar_bg     "#1a1b26"   # bar background
set -g @bar_fg     "#c0caf5"   # bar foreground
set -g @dim_fg     "#565f89"   # dimmed text
set -g @hi_bg      "#3b4261"   # active window background
set -g @hi_fg      "#7aa2f7"   # active window foreground
set -g @session_bg "#41a6b5"   # session name background
set -g @session_fg "#1a1b26"   # session name foreground
set -g @win_bg     "#292e42"   # inactive window background
set -g @prefix_bg  "#e0af68"   # prefix mode background
set -g @prefix_fg  "#1a1b26"   # prefix mode foreground
set -g @copy_bg    "#bb9af7"   # copy mode background
set -g @copy_fg    "#1a1b26"   # copy mode foreground
