# @path[tmux/parts/status.conf]
# the status bar: layout, modes, window list, bar style, and the end segments.

# ==========================================================
# LAYOUT
# ==========================================================

set -g status on
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-left-length 30
set -g status-right-length 60

# ==========================================================
# MODES
# ==========================================================
# badge text is padded to six columns, so the session name stays aligned.

set -g @mode_normal "NORMAL"
set -g @mode_prefix "PREFIX"
set -g @mode_copy   "COPY  "

# ==========================================================
# WINDOW LIST
# ==========================================================
# - each window prints as four fields: index:title:state:panes
# - state is one letter, most urgent first:
#     Z zoom   ! bell   # activity   ~ silence   M marked   O modal
# - no state prints the default "."
# - zoom is tinted; the other states share the window foreground
# - a format needs care here: "##" for activity, full names for the
#   index and name, and E: to read [@win_state]

set -g @win_state "#{?window_zoomed_flag,Z,#{?window_bell_flag,!,#{?window_activity_flag,##,#{?window_silence_flag,~,#{?window_marked_flag,M,#{?window_modal_pane,O,.}}}}}}"

setw -g window-status-format "#[bg=#{@win_bg},fg=#{@dim_fg}] #{window_index}#[fg=#{@bar_fg}]:#{window_name}:#{?window_zoomed_flag,#[fg=#{@hi_fg}]#{E:@win_state}#[fg=#{@bar_fg}],#{E:@win_state}}:#{window_panes} #[default]"
setw -g window-status-current-format "#[bg=#{@hi_bg},fg=#{@hi_fg}] [#{window_index}#[fg=#{@bar_fg}]:#{window_name}:#{?window_zoomed_flag,#[fg=#{@hi_fg}]#{E:@win_state}#[fg=#{@bar_fg}],#{E:@win_state}}:#{window_panes}#[fg=#{@hi_fg}]] #[default]"

# ==========================================================
# BAR STYLE
# ==========================================================
# prefix mode shifts the whole bar background, so peripheral vision catches it.
# inner commas are escaped as #, so a #{?} branch is not split in two.

set -g status-style "#{?client_prefix,bg=#{@prefix_bg}#,fg=#{@prefix_fg},bg=#{@bar_bg}#,fg=#{@bar_fg}}"

# ==========================================================
# SEGMENTS
# ==========================================================
# - left: mode badge, then the session name.
# - right: time.
# - the window list between them is defined in the WINDOW LIST block above.
#
# mode condition order: client_prefix, then pane_in_mode, then normal

set -g status-left "#{?client_prefix,#[bg=#{@prefix_bg}]#[fg=#{@prefix_fg}],#{?pane_in_mode,#[bg=#{@copy_bg}]#[fg=#{@copy_fg}],}}#{?client_prefix,#{@mode_prefix},#{?pane_in_mode,#{@mode_copy},#{@mode_normal}}} #[default]#[bg=#{@session_bg},fg=#{@session_fg}] #S #[default] "

set -g status-right " #[fg=#{@dim_fg}]%H:%M "
